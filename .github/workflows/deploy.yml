name: Test & Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Install dev dependencies
        run: pip install -r requirements-dev.lock

      - name: Run tests
        env:
          CLASSIFINDER_API_KEYS: "ss_test_abc123def456ghi789jkl012mno345pqr678stu901vwx"
          CLASSIFINDER_RATE_LIMIT_PER_MINUTE: "1000"
        run: python -m pytest tests/ -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: superfly/flyctl-actions/setup-flyctl@63da3ecc5e2793b98a3f2519b3d75d4f4c11cec2 # master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

  # Self-host image → ghcr.io/classifinder/classifinder (linux/amd64 + linux/arm64).
  # Runs in parallel with the Fly deploy; a failure here never blocks prod.
  publish-image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push to GHCR with GITHUB_TOKEN
      id-token: write       # OIDC for build provenance
      attestations: write   # store the provenance attestation
    env:
      IMAGE: ghcr.io/classifinder/classifinder
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Compute version
        id: ver
        run: echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ver.outputs.version }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=ClassiFinder
            org.opencontainers.image.description=Self-hosted ClassiFinder: scan text for leaked secrets and prompt-injection markers. Stateless, no database, no request logging.
            org.opencontainers.image.url=https://classifinder.ai
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.selfhost
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: CLASSIFINDER_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test published image
        run: |
          docker run -d --name cf -p 8000:8000 \
            -e CLASSIFINDER_API_KEYS=ss_test_smoke000000000000000000000000000000000 \
            "${IMAGE}@${{ steps.push.outputs.digest }}"
          for i in $(seq 1 20); do curl -fs localhost:8000/v1/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/v1/scan \
            -H 'X-API-Key: ss_test_smoke000000000000000000000000000000000' \
            -H 'content-type: application/json' \
            -d '{"text":"AWS_ACCESS_KEY_ID=AKIAQWERTYUIOPASDFGH"}' | grep -q aws_access_key

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
