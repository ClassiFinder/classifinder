[project]
name = "classifinder"
version = "1.0.0"
description = "Lightweight stateless API for scanning text for leaked secrets and credentials"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "libsql-experimental>=0.0.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
